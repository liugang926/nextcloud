name: Production release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/production-release.yml'
    tags:
      - 'prod-*'

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: nextcloud-production-release
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      auto: ${{ steps.resolve.outputs.auto }}
      commit: ${{ steps.resolve.outputs.commit }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release identity and uniqueness
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            commit="$(git rev-parse "$GITHUB_REF^{commit}")"
            auto=false
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            commit="$GITHUB_SHA"
            tag="prod-$(date -u +%Y%m%d)-${commit:0:12}"
            auto=true
          else
            echo 'Production releases must come from main or a prod-* tag' >&2
            exit 1
          fi
          [[ "$tag" =~ ^prod-[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          test "$commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main

          should_release=true
          if release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease 2>/dev/null)"; then
            if [[ "$auto" == true && "$(jq -r .isDraft <<< "$release")" == false \
                && "$(jq -r .isPrerelease <<< "$release")" == false ]]; then
              echo "Published release $tag already exists; this main commit will not be released twice."
              should_release=false
            else
              echo "A draft, prerelease, or manually requested release already exists for $tag" >&2
              exit 1
            fi
          fi
          printf 'tag=%s\ncommit=%s\nauto=%s\nshould_release=%s\n' \
            "$tag" "$commit" "$auto" "$should_release" >> "$GITHUB_OUTPUT"

  production:
    needs: identity
    if: needs.identity.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_AUTO: ${{ needs.identity.outputs.auto }}
      RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_REPO: ${{ github.repository }}
      NEXTCLOUD_SOURCE_IMAGE: ghcr.io/liugang926/nextcloud-production-core:34.0.4-php8.5.12-r1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify resolved release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^prod-[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          if [[ "$RELEASE_AUTO" == false ]]; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          fi

      - name: Verify production updater safety tests
        run: |
          python3 deploy/production/test_release.py
          python3 deploy/production/test_manifest.py
          python3 deploy/production/test_parallel_download.py
          python3 deploy/production/test_image_identity.py
          for script in deploy/production/*.sh; do bash -n "$script"; done

      - name: Check out the pinned Nextcloud 34.0.4 image recipe
        uses: actions/checkout@v7.0.1
        with:
          repository: nextcloud/docker
          ref: a1206d2467689ecb8597b7e5b753b49dda29b773
          path: .ci/nextcloud-docker
          persist-credentials: false

      - name: Build or reuse PHP 8.5.12-hardened Nextcloud core
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ github.token }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash deploy/production/build-security-nextcloud-image.sh \
            "$NEXTCLOUD_SOURCE_IMAGE" \
            "$GITHUB_WORKSPACE/.ci/nextcloud-docker/34/apache" \
            "8.5.12" "34.0.4"

      - name: Fetch the pinned Nextcloud 34 Office app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output deploy/production/richdocuments-11.1.2.tar.gz \
            https://github.com/nextcloud-releases/richdocuments/releases/download/v11.1.2/richdocuments-v11.1.2.tar.gz
          printf '%s\n' '96766a94cf417a716e47ed89c6ff2411c54954caa916afcdddc4d9668dffb557  deploy/production/richdocuments-11.1.2.tar.gz' | sha256sum --check

      - name: Pull amd64 images and create verified release assets
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$RELEASE_REPO" --tag "$RELEASE_TAG"
                --nextcloud-image "$NEXTCLOUD_SOURCE_IMAGE")
          if [[ "$RELEASE_AUTO" == true ]]; then
            args+=(--allow-missing-tag)
          fi
          python3 deploy/production/manifest.py "${args[@]}"

      - name: Verify checkpoint restore with a distinct application database role
        run: python3 deploy/production/test_restore_roles.py --image postgres:16-alpine --pull=never

      - name: Require successful Nextcloud install, API and upgrade checks on main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            runs="$(gh api --method GET "repos/$RELEASE_REPO/actions/workflows/integration.yml/runs" -f head_sha="$RELEASE_COMMIT" -f event=push -f per_page=100)"
            latest="$(jq -c '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number) | last // {}' <<< "$runs")"
            run_id="$(jq -r '.id // empty' <<< "$latest")"
            if [[ -n "$run_id" ]]; then
              jobs="$(gh api "repos/$RELEASE_REPO/actions/runs/$run_id/jobs?per_page=100")"
              required="$(jq -c '[.jobs[] | select(.name == "local-smoke" or .name == "direct-upgrade")]' <<< "$jobs")"
              failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<< "$required")"
              test "$failed" = 0
              passed="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<< "$required")"
              if [[ "$passed" == 2 ]]; then exit 0; fi
              if [[ "$(jq -r .status <<< "$latest")" == completed ]]; then
                echo 'The required Nextcloud main checks did not complete successfully' >&2
                exit 1
              fi
            fi
            sleep 60
          done
          echo 'No successful main Nextcloud install/API/upgrade checks for the release commit' >&2
          exit 1

      - name: Publish complete immutable-by-policy release
        shell: bash
        run: |
          set -euo pipefail
          printf 'Production deployment for commit %s, merged into main; Nextcloud installation/API and direct-upgrade checks passed. Includes a Nextcloud 34.0.4 core image rebuild on PHP 8.5.12.\n' "$RELEASE_COMMIT" > /tmp/nextcloud-production-release-notes.txt
          if [[ "$RELEASE_AUTO" == true ]]; then
            printf 'This release was published automatically after the exact main commit passed the required checks.\n' >> /tmp/nextcloud-production-release-notes.txt
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --target "$RELEASE_COMMIT" --draft --title "$RELEASE_TAG" \
              --notes-file /tmp/nextcloud-production-release-notes.txt dist/production/*
          else
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --verify-tag \
              --target "$RELEASE_COMMIT" --draft --title "$RELEASE_TAG" \
              --notes-file /tmp/nextcloud-production-release-notes.txt dist/production/*
          fi
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" \
            --json tagName,isDraft,isPrerelease,url
