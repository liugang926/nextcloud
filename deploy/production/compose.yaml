name: nextcloud-production

# Run with --env-file /srv/nextcloud-production/secrets/images.env.
# Release directories contain code only. Mutable state lives on /data.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nextcloud-environment: &nextcloud-environment
  REDIS_HOST: redis
  NEXTCLOUD_DATA_DIR: /var/www/data
  NEXTCLOUD_TRUSTED_DOMAINS: "${NEXTCLOUD_DOMAIN:-cloud.tianjizn.com} nextcloud"
  APACHE_DISABLE_REWRITE_IP: "1"
  TRUSTED_PROXIES: "172.30.55.40"
  OVERWRITEHOST: ${NEXTCLOUD_DOMAIN:-cloud.tianjizn.com}
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: https://${NEXTCLOUD_DOMAIN:-cloud.tianjizn.com}
  OVERWRITECONDADDR: '^172[.]30[.]55[.]40\z'
  PHP_MEMORY_LIMIT: 512M
  PHP_UPLOAD_LIMIT: 2G
  NEXTCLOUD_OCC_PATH: /var/www/html/occ
  WEKNORA_EVENT_ALLOWED_ORIGINS: ${WEKNORA_HTTPS_ORIGINS:-}
  # Never inherit development identity or transport bypasses from the host.
  WEKNORA_EVENT_DEV_HTTP: "0"
  WEKNORA_LOCAL_COMPOSE: "0"
  WEKNORA_DEV_ALLOW_UNVERIFIED_IDENTITY: "0"

x-nextcloud: &nextcloud
  image: ${NEXTCLOUD_IMAGE:?Set NEXTCLOUD_IMAGE to the approved Nextcloud 34.0.4 apache image}
  pull_policy: never
  restart: unless-stopped
  init: true
  cgroup_parent: nextcloud-production.slice
  environment: *nextcloud-environment
  volumes:
    - /data/nextcloud-production/html:/var/www/html
    - /data/nextcloud-production/data:/var/www/data
    - ../../apps/integration_weknora:/var/www/html/custom_apps/integration_weknora:ro
    - ../../scripts:/opt/nextcloud-production/scripts:ro
    - ./apachelogs.conf:/etc/apache2/conf-enabled/zz-production-logs.conf:ro
  networks:
    - production
  logging: *logging
  stop_grace_period: 110s
  depends_on:
    nextcloud:
      condition: service_healthy

services:
  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the approved PostgreSQL 16 alpine image}
    pull_policy: never
    restart: unless-stopped
    cgroup_parent: nextcloud-production.slice
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    shm_size: 256m
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db_password
    secrets:
      - nextcloud_db_password
    volumes:
      - /data/nextcloud-production/postgres:/var/lib/postgresql/data
    networks:
      production:
        ipv4_address: 172.30.55.10
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
    stop_grace_period: 120s

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to the approved Redis 7 alpine image}
    pull_policy: never
    restart: unless-stopped
    cgroup_parent: nextcloud-production.slice
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 128
    command: [redis-server, --appendonly, "yes", --maxmemory, 768mb, --maxmemory-policy, noeviction]
    volumes:
      - /data/nextcloud-production/redis:/data
    networks:
      production:
        ipv4_address: 172.30.55.11
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  nextcloud:
    <<: *nextcloud
    cpus: 4
    mem_limit: 6g
    pids_limit: 512
    ports:
      - "127.0.0.1:18083:80"
    environment:
      <<: *nextcloud-environment
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db_password
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
    networks:
      production:
        ipv4_address: 172.30.55.20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 5 http://127.0.0.1/status.php |
          php -r '$$s=json_decode(stream_get_contents(STDIN),true); exit(!is_array($$s) || empty($$s["installed"]) || !empty($$s["maintenance"]) || !empty($$s["needsDbUpgrade"]));'
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  cron:
    <<: *nextcloud
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 128
    entrypoint: /cron.sh

  event-worker:
    <<: *nextcloud
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 128
    user: www-data
    entrypoint: [/bin/sh, /opt/nextcloud-production/scripts/weknora-event-worker.sh]

  event-status-worker:
    <<: *nextcloud
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 128
    user: www-data
    entrypoint: [/bin/sh, /opt/nextcloud-production/scripts/weknora-event-status-worker.sh]

  directory-discovery-worker:
    <<: *nextcloud
    cpus: 0.5
    mem_limit: 768m
    pids_limit: 128
    user: www-data
    entrypoint: [/bin/sh, /opt/nextcloud-production/scripts/ops/directory-discovery-worker.sh]

  stage-status-worker:
    <<: *nextcloud
    cpus: 1
    mem_limit: 1536m
    pids_limit: 128
    user: www-data
    entrypoint: [/bin/bash, /opt/nextcloud-production/scripts/ops/stage-status-worker.sh]
    environment:
      <<: *nextcloud-environment
      WEKNORA_STATUS_WORKERS: "2"

  office:
    image: ${OFFICE_IMAGE:?Set OFFICE_IMAGE to the approved Collabora CODE image}
    pull_policy: never
    restart: unless-stopped
    init: true
    cgroup_parent: nextcloud-production.slice
    cpus: 3
    mem_limit: 6g
    pids_limit: 512
    shm_size: 512m
    cap_add:
      - MKNOD
    environment:
      aliasgroup1: https://${NEXTCLOUD_DOMAIN:-cloud.tianjizn.com}:443
      aliasgroup2: http://nextcloud:80
      server_name: ${NEXTCLOUD_DOMAIN:-cloud.tianjizn.com}
      dictionaries: "en_US zh_CN"
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=true
        --o:logging.level=warning --o:net.proto=IPv4
        --o:num_prespawn_children=1
    ports:
      - "127.0.0.1:19980:9980"
    # Only transient Office jails live here; source documents remain in Nextcloud.
    volumes:
      - /data/nextcloud-production/office:/opt/cool/child-roots
    networks:
      production:
        ipv4_address: 172.30.55.30
    healthcheck:
      # CODE 26.04 uses a distroless runtime with no shell or curl.
      test: [CMD, /usr/bin/coolwsd, --probe, --use-env-vars]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    logging: *logging
    stop_grace_period: 120s

  proxy:
    image: ${PROXY_IMAGE:?Set PROXY_IMAGE to the approved nginx alpine image}
    pull_policy: never
    restart: unless-stopped
    cgroup_parent: nextcloud-production.slice
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    ports:
      # The operator's separate HTTPS gateway forwards to this HTTP backend.
      - "10.106.1.128:18082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      production:
        ipv4_address: 172.30.55.40
    depends_on:
      nextcloud:
        condition: service_healthy
      office:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null --header='Host: cloud.tianjizn.com' http://127.0.0.1/status.php"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logging

networks:
  production:
    name: nextcloud-production
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.55.0/24
          gateway: 172.30.55.1

secrets:
  nextcloud_db_password:
    file: /srv/nextcloud-production/secrets/nextcloud_db_password
  nextcloud_admin_password:
    file: /srv/nextcloud-production/secrets/nextcloud_admin_password
