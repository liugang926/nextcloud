# Container HTTP backend. The operator supplies HTTPS on the public domain.
# Forward cloud.tianjizn.com, including WebSockets, to 10.106.1.128:18082.
# Do not log query strings: WOPI URLs may contain document access tokens.
log_format nextcloud_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# nginx upstream errors embed the complete request URI, including WOPI tokens.
# Health checks and the query-free access log retain failure status diagnostics.
error_log /dev/null;

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log nextcloud_safe;
    return 444;
}

server {
    listen 80;
    server_name cloud.tianjizn.com;
    access_log /var/log/nginx/access.log nextcloud_safe;
    # Only the operator's HTTPS gateway may supply the visitor address.
    # Forward the resolved address below, never the original header chain.
    set_real_ip_from 10.106.1.119;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 2G;
    client_body_timeout 3600s;
    send_timeout 3600s;
    add_header X-Content-Type-Options nosniff always;
    # SAMEORIGIN also permits the same-domain Office iframe.
    add_header X-Frame-Options SAMEORIGIN always;

    location = /.well-known/carddav { return 301 https://cloud.tianjizn.com/remote.php/dav/; }
    location = /.well-known/caldav { return 301 https://cloud.tianjizn.com/remote.php/dav/; }

    location ~ ^/(?:browser|hosting|cool)(?:/|$) {
        proxy_pass http://office:9980;
        proxy_http_version 1.1;
        proxy_set_header Host cloud.tianjizn.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://nextcloud:80;
        proxy_http_version 1.1;
        proxy_set_header Host cloud.tianjizn.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host cloud.tianjizn.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
