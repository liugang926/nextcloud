services:
  # Pin the prebuilt services to the exact artifacts verified in the local
  # runtime. The app/UI are source-built candidates with separate manifests.
  postgres:
    image: paradedb/paradedb:v0.22.6-pg17@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
  redis:
    image: redis:7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
  docreader:
    image: wechatopenai/weknora-docreader@sha256:59e26f98f17c296c5f4bd216404558f51d31991b580cfef1d204903a01e4b46b
  openldap:
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4@sha256:966fd39ed25813890e9bd57dac56def163bbcfe64967e0bae59ab018d505bd93
  lan-gateway:
    image: nginx:1.30.3-alpine@sha256:cf6caa384debc325efa6818a8bc6fa91783ee2621cd124b90b0e661a4834be10
  app:
