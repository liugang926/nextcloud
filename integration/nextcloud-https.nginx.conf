server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    absolute_redirect off;

    client_max_body_size 512m;
    client_body_timeout 1h;

    # Apache's .htaccess redirects these paths without reading the forwarded
    # scheme. Relative Locations keep DAV discovery on the HTTPS origin.
    location ~ ^/\.well-known/(carddav|caldav)/?$ {
        return 301 /remote.php/dav/;
    }

    location / {
        # Docker DNS is re-resolved if the Nextcloud container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nextcloud_backend nextcloud;
        proxy_pass http://$nextcloud_backend:80;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Rewrite same-host absolute redirects emitted by Apache over HTTP.
        proxy_redirect http://$http_host/ https://$http_host/;
        # The parallel HTTP development listener remains usable on this host.
        proxy_hide_header Strict-Transport-Security;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # Never pass a caller-controlled forwarded chain to a trusted proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The stock Nextcloud Apache image runs mod_remoteip on X-Real-IP.
        # Sending the client IP there would hide this proxy's exact address
        # from Nextcloud, so it could not trust X-Forwarded-Proto. Explicitly
        # strip a caller-supplied X-Real-IP as well.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
    }
}
