services:
  app:
    image: weknora-ldap-app:nextcloud-integration
    networks:
      default:
      nextcloud-dev:
    environment:
      # Preserve the base stack's local model host while adding isolated Nextcloud hosts.
      SSRF_WHITELIST_EXTRA: host.docker.internal,nextcloud,mock-embedding,api.deepseek.com

networks:
  nextcloud-dev:
    external: true
    name: nextcloud-weknora-dev_default
